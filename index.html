    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&display=swap');
        
        body {
            font-family: 'Chakra Petch', sans-serif;
            background-color: #050508;
            color: #e2e8f0;
            touch-action: pan-x pan-y pinch-zoom;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        /* Responsive touch action for drag targets */
        .number-box {
            touch-action: none; /* Prevent scroll/zoom interference when specifically targeting cards */
            transition: transform 0.15s ease, box-shadow 0.15s ease;

<script>
    // ... existing code ...

    let draggedItem = null;
    let touchOffset = { x: 0, y: 0 };
    let currentTouchId = null;

    function handleTouchStart(e) {
        // If more than 1 finger is touching, cancel any active dragging and allow native pinch zoom
        if (e.touches.length > 1) {
            if (draggedItem) {
                resetDraggedItemPosition();
            }
            return; // Allow browser to perform pinch-zoom
        }

        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        
        if (!target) return;
        
        const numberBox = target.closest('.number-box');
        if (numberBox && !numberBox.classList.contains('placed')) {
            // Prevent scrolling/zooming only when actively grabbing a card with 1 finger
            if (e.cancelable) e.preventDefault();
            
            draggedItem = numberBox;
            currentTouchId = touch.identifier;
            
            const rect = numberBox.getBoundingClientRect();
            touchOffset.x = touch.clientX - rect.left;
            touchOffset.y = touch.clientY - rect.top;

            draggedItem.style.position = 'fixed';
            draggedItem.style.zIndex = '1000';
            draggedItem.style.width = `${rect.width}px`;
            draggedItem.style.height = `${rect.height}px`;
            draggedItem.classList.add('scale-110', 'shadow-2xl', 'opacity-90');
            
            updateTouchPosition(touch);
            playSound('grab');
        }
    }

    function handleTouchMove(e) {
        // Cancel drag immediately if a second finger touches down during a move
        if (e.touches.length > 1) {
            if (draggedItem) {
                resetDraggedItemPosition();
            }
            return;
        }

        if (!draggedItem) return;

        // Find the touch corresponding to the active drag
        let activeTouch = null;
        for (let i = 0; i < e.touches.length; i++) {
            if (e.touches[i].identifier === currentTouchId) {
                activeTouch = e.touches[i];
                break;
            }
        }

        if (activeTouch) {
            if (e.cancelable) e.preventDefault();
            updateTouchPosition(activeTouch);
        }
    }

    function handleTouchEnd(e) {
        if (!draggedItem) return;

        // If active dragging touch ended
        let activeTouchEnded = true;
        for (let i = 0; i < e.touches.length; i++) {
            if (e.touches[i].identifier === currentTouchId) {
                activeTouchEnded = false;
                break;
            }
        }

        if (activeTouchEnded) {
            const changedTouch = e.changedTouches[0];
            if (changedTouch) {
                // Drop card logic
                const dropTarget = document.elementFromPoint(changedTouch.clientX, changedTouch.clientY);
                const slot = dropTarget ? dropTarget.closest('.slot-box') : null;

                if (slot && !slot.classList.contains('filled')) {
                    placeCardInSlot(draggedItem, slot);
                } else {
                    resetDraggedItemPosition();
                }
            } else {
                resetDraggedItemPosition();
            }
        }
    }

    function handleTouchCancel(e) {
        if (draggedItem) {
            resetDraggedItemPosition();
        }
    }

    function updateTouchPosition(touch) {
        if (!draggedItem) return;
        draggedItem.style.left = `${touch.clientX - touchOffset.x}px`;
        draggedItem.style.top = `${touch.clientY - touchOffset.y}px`;
    }

    function resetDraggedItemPosition() {
        if (!draggedItem) return;
        draggedItem.style.position = '';
        draggedItem.style.zIndex = '';
        draggedItem.style.left = '';
        draggedItem.style.top = '';
        draggedItem.style.width = '';
        draggedItem.style.height = '';
        draggedItem.classList.remove('scale-110', 'shadow-2xl', 'opacity-90');
        draggedItem = null;
        currentTouchId = null;
    }

    // Attach passive touch handlers or proper event parameters
    document.addEventListener('touchstart', handleTouchStart, { passive: false });
    document.addEventListener('touchmove', handleTouchMove, { passive: false });
    document.addEventListener('touchend', handleTouchEnd);
    document.addEventListener('touchcancel', handleTouchCancel);

    // ... existing code ...
</script>
